<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>News Channel — 3D Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap');

  :root{
    --sky-top:#eaf6ff;
    --sky-bot:#8fc8ec;
    --chrome:#1c6dbf;
    --chrome-dark:#124d8a;
    --ink:#123252;
    --ink-soft:#4d6b87;
    --panel:#ffffff;
    --c-science:#2fb7c0;
    --c-tech:#7a6fd6;
    --c-business:#3fae6a;
    --c-space:#e0578a;
    --font-display:'Baloo 2', 'Quicksand', system-ui, sans-serif;
    --font-body:'Nunito Sans', system-ui, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:var(--font-body);
    background:radial-gradient(120% 90% at 50% -10%, var(--sky-top), var(--sky-bot) 60%, #5da3d6 100%);
    overflow:hidden;
    color:var(--ink);
    user-select:none;
  }
  #app{ position:relative; width:100%; height:100dvh; display:flex; flex-direction:column; }

  .chrome-bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    background:linear-gradient(180deg, #ffffff 0%, #eaf3fb 100%);
    border-bottom:3px solid rgba(28,109,191,0.25);
    box-shadow:0 3px 10px rgba(18,50,82,0.12);
    position:relative; z-index:20;
  }
  .clock{ font-family:var(--font-display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; min-width:78px; }
  .clock .dot{ width:7px;height:7px;border-radius:50%; background:#3fae6a; box-shadow:0 0 6px #3fae6a; animation:pulse 2s infinite ease-in-out; }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .title-block{ text-align:center; line-height:1; }
  .title-block .kicker{ font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:2px; }
  .title-block .title{ font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--chrome-dark); }
  .tour-btn{
    font-family:var(--font-display); font-weight:600; font-size:12px; color:#fff;
    background:linear-gradient(180deg, var(--chrome), var(--chrome-dark));
    border:none; border-radius:999px; padding:9px 14px;
    display:flex; align-items:center; gap:6px;
    box-shadow:0 3px 0 rgba(18,50,82,0.35), 0 4px 8px rgba(18,50,82,0.25);
    cursor:pointer; transition:transform .12s ease;
  }
  .tour-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(18,50,82,0.35);}
  .tour-btn.active{ background:linear-gradient(180deg, #e0578a, #b83e6c); }
  .tour-btn svg{ width:13px;height:13px; flex:0 0 auto; }

  .tour-group{ display:flex; align-items:center; gap:8px; }
  .speed-control{
    display:flex; align-items:center; gap:0;
    background:#eaf3fb; border-radius:999px; padding:3px;
    box-shadow:inset 0 1px 3px rgba(18,50,82,0.15);
  }
  .speed-btn{
    width:24px; height:24px; border-radius:50%; border:none;
    background:#fff; color:var(--chrome-dark); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
    cursor:pointer; box-shadow:0 1px 2px rgba(18,50,82,0.2);
    transition:transform .1s ease;
  }
  .speed-btn:active{ transform:scale(0.9); }
  .speed-btn:disabled{ opacity:.35; cursor:default; }
  .speed-btn:disabled:active{ transform:none; }
  .speed-label{
    font-family:var(--font-display); font-weight:700; font-size:11.5px;
    color:var(--ink); width:34px; text-align:center;
  }

  .stage{ flex:1 1 auto; position:relative; overflow:hidden; }
  #globeCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #globeCanvas.dragging{ cursor:grabbing; }

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; color:var(--ink-soft); font-size:13px;
    gap:8px; z-index:5;
  }
  .loading.hide{ display:none; }

  .drag-hint{
    position:absolute; bottom:3%; left:50%; transform:translateX(-50%);
    font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:center; gap:6px; opacity:.75; z-index:5; pointer-events:none;
  }

  .dock{
    flex:0 0 auto; display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    overflow-x:auto; background:linear-gradient(0deg, #ffffff 0%, #eaf3fb 100%);
    border-top:3px solid rgba(28,109,191,0.25); box-shadow:0 -3px 10px rgba(18,50,82,0.12);
    position:relative; z-index:20; scrollbar-width:none;
  }
  .dock::-webkit-scrollbar{ display:none; }
  .cat-btn{
    flex:0 0 auto; font-family:var(--font-display); font-weight:600; font-size:12.5px; color:#fff;
    border:none; border-radius:999px; padding:10px 15px; display:flex; align-items:center; gap:7px;
    cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.18); transition:transform .12s ease, filter .15s ease;
  }
  .cat-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.18); }
  .cat-btn.inactive{ filter:brightness(0.6) saturate(0.7); opacity:.7; }
  .cat-btn .swatch{ width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,0.9); }

  .overlay-bg{ position:absolute; inset:0; background:rgba(9,30,54,0.45); backdrop-filter:blur(2px); z-index:30; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .overlay-bg.show{ opacity:1; pointer-events:auto; }
  .article-card{
    position:absolute; left:50%; bottom:0; transform:translate(-50%, 100%);
    width:min(92vw, 460px); max-height:78vh; background:var(--panel);
    border-radius:22px 22px 0 0; box-shadow:0 -10px 30px rgba(18,50,82,0.4); z-index:31;
    padding:18px 20px calc(22px + env(safe-area-inset-bottom)); overflow-y:auto;
    transition:transform .32s cubic-bezier(.2,.8,.3,1);
  }
  .article-card.show{ transform:translate(-50%, 0); }
  @media (min-width:720px){
    .article-card{ left:auto; right:24px; bottom:24px; top:24px; transform:translateX(120%); width:340px; max-height:none; border-radius:22px; }
    .article-card.show{ transform:translateX(0); }
  }
  .card-handle{ width:38px;height:4px;border-radius:99px; background:#d9e4ee; margin:0 auto 14px; }
  .card-tag{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-display); font-weight:700;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#fff; padding:5px 10px;
    border-radius:999px; margin-bottom:12px;
  }
  .card-title{ font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.28; margin:0 0 12px; }
  .institutes{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .institute-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .institute-row .dot2{ width:7px;height:7px;border-radius:50%; flex:0 0 auto; }
  .card-body{ font-size:14.5px; line-height:1.65; color:#2c4562; }
  .card-close{ position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%; border:none; background:#eef4fa; color:var(--ink-soft); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
</style>
</head>
<body>
<div id="app">
  <div class="chrome-bar">
    <div class="clock"><span class="dot"></span><span id="clockText">--:--</span></div>
    <div class="title-block">
      <span class="kicker">3D Globe Prototype</span>
      <span class="title">News Channel</span>
    </div>
    <div class="tour-group">
      <div class="speed-control" id="speedControl">
        <button class="speed-btn" id="speedDown" aria-label="Slower">&minus;</button>
        <span class="speed-label" id="speedLabel">1x</span>
        <button class="speed-btn" id="speedUp" aria-label="Faster">+</button>
      </div>
      <button class="tour-btn" id="tourBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
        <span>Tour</span>
      </button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="globeCanvas"></canvas>
    <div class="loading" id="loading">Loading globe…</div>
    <div class="drag-hint">drag to rotate · tap a pin or arc</div>
  </div>

  <div class="dock" id="dock"></div>

  <div class="overlay-bg" id="overlayBg"></div>
  <div class="article-card" id="articleCard">
    <button class="card-close" id="cardClose">&times;</button>
    <div class="card-handle"></div>
    <div class="card-tag" id="cardTag">Science</div>
    <h2 class="card-title" id="cardTitle">Headline</h2>
    <div class="institutes" id="cardInstitutes"></div>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

b/iiB2/agqlBOSn+FL5aTy3nvirIA7H7UEe1BXCBwEGgJP/gasFI7GaAkHoftQQBHcUmwA8VYjvP2o2/3FBBtPQfvSbFEyZHtNWNvzQU0FfYeQM0bVHBiD2FWNvtRt9qCuGgnhAz7Cmlok/oH7D+VWtv95pQn2oKgaIMlH2NP8odjU5RS7KCANx0o2f3AqfbHFG2gh2AcTS7e4J+9S7R2oCfmg//Z';
  loader.load(
    EARTH_TEXTURE_DATA_URI,
    (tex) => { sphereMat.map = tex; sphereMat.color.set(0xffffff); sphereMat.needsUpdate = true; loadingEl.classList.add('hide'); },
    undefined,
    () => { loadingEl.textContent = 'Using simplified globe (texture unavailable)'; setTimeout(()=>loadingEl.classList.add('hide'), 1200); }
  );

  // subtle atmosphere shell
  const atmoGeo = new THREE.SphereGeometry(RADIUS * 1.02, 64, 64);
  const atmoMat = new THREE.MeshBasicMaterial({ color:0x8fd6ff, transparent:true, opacity:0.08, side:THREE.BackSide });
  globeGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

  function latLonToVec3(lat, lon, radius){
    const phi = (90 - lat) * (Math.PI/180);
    const theta = (lon + 180) * (Math.PI/180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
       radius * Math.cos(phi),
       radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  function colorFor(cat){
    return new THREE.Color(CATS.find(c=>c.id===cat).color);
  }

  // ---------------- Pins & Arcs ----------------
  let pinMeshes = [];   // {mesh, storyId}
  let arcMeshes = [];   // {mesh, pulse, curve, storyId}
  let storyObjects = {}; // storyId -> {pins:[], arcs:[]}

  const pinGeo = new THREE.SphereGeometry(0.024 * RADIUS, 16, 16);
  const pulseGeo = new THREE.SphereGeometry(0.014 * RADIUS, 10, 10);

  function buildGlobeContent(){
    // clear anything from a previous build (not currently re-invoked, but safe if it ever is)
    pinMeshes.forEach(p => globeGroup.remove(p.mesh));
    arcMeshes.forEach(a => { globeGroup.remove(a.mesh); globeGroup.remove(a.pulse); });
    pinMeshes = []; arcMeshes = []; storyObjects = {};

    NEWS.forEach(story => {
      storyObjects[story.id] = { pins: [], arcs: [] };
      const color = colorFor(story.cat);
      const points = story.inst.map(k => INST[k]).filter(Boolean);

      // pins
      points.forEach(p => {
        const pos = latLonToVec3(p.lat, p.lon, RADIUS * 1.01);
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(pinGeo, mat);
        mesh.position.copy(pos);
        mesh.userData = { storyId: story.id };
        globeGroup.add(mesh);
        pinMeshes.push({ mesh, storyId: story.id });
        storyObjects[story.id].pins.push(mesh);
      });

      // arc if 2+ institutions
      if(points.length > 1){
        for(let i=0;i<points.length-1;i++){
          const a = latLonToVec3(points[i].lat, points[i].lon, RADIUS);
          const b = latLonToVec3(points[i+1].lat, points[i+1].lon, RADIUS);
          const mid = a.clone().add(b).multiplyScalar(0.5);
          const liftAmount = (0.35 + a.distanceTo(b) * 0.18) * RADIUS;
          mid.normalize().multiplyScalar(RADIUS + liftAmount);
          const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
          const tubeGeo = new THREE.TubeGeometry(curve, 48, 0.004 * RADIUS, 6, false);
          const tubeMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.75 });
          const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
          tubeMesh.userData = { storyId: story.id };
          globeGroup.add(tubeMesh);

          const pulseMat = new THREE.MeshBasicMaterial({ color:0xffffff });
          const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
          globeGroup.add(pulseMesh);

          const arcEntry = { mesh: tubeMesh, pulse: pulseMesh, curve, storyId: story.id, phase: Math.random() };
          arcMeshes.push(arcEntry);
          storyObjects[story.id].arcs.push(arcEntry);
        }
      }
    });
  }

  // ---------------- Category filter ----------------
  let activeCat = 'all';
  function applyFilter(){
    NEWS.forEach(story => {
      const match = activeCat === 'all' || story.cat === activeCat;
      const obj = storyObjects[story.id];
      obj.pins.forEach(m => { m.material.opacity = match ? 1 : 0.18; m.material.transparent = true; });
      obj.arcs.forEach(a => {
        a.mesh.material.opacity = match ? 0.75 : 0.08;
        a.pulse.visible = match;
      });
    });
  }

  // ---------------- Interaction: drag / auto-rotate ----------------
  let dragging = false;
  let dragStart = { x:0, y:0 };
  let rotStart = { x:0, y:0 };
  let moved = 0;
  let autoRotate = true;
  let idleTimer = null;
  let tourAnim = null; // {startY, targetY, startTime, duration, onDone}

  function pauseAuto(){
    autoRotate = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{ autoRotate = true; }, 3500);
  }

  canvas.addEventListener('pointerdown', (e)=>{
    dragging = true;
    moved = 0;
    tourAnim = null;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
    dragStart.x = e.clientX; dragStart.y = e.clientY;
    rotStart.x = globeGroup.rotation.x; rotStart.y = globeGroup.rotation.y;
    pauseAuto();
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    moved += Math.abs(dx) + Math.abs(dy);
    globeGroup.rotation.y = rotStart.y + dx * 0.006;
    globeGroup.rotation.x = Math.max(-0.9, Math.min(0.9, rotStart.x + dy * 0.006));
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    if(moved < 6){ handleTap(e); }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const raycaster = new THREE.Raycaster();
  raycaster.params.Mesh.threshold = 0.02;
  const pointerNDC = new THREE.Vector2();

  function handleTap(e){
    const rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const targets = [...pinMeshes.map(p=>p.mesh), ...arcMeshes.map(a=>a.mesh)];
    const hits = raycaster.intersectObjects(targets);
    if(hits.length){
      const hit = hits[0].object;
      openArticle(hit.userData.storyId);
    }
  }

  // ---------------- Render loop ----------------
  let last = performance.now();
  function animate(now){
    const dt = now - last; last = now;

    if(tourAnim){
      const t = Math.min(1, (now - tourAnim.startTime) / tourAnim.duration);
      const eased = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      globeGroup.rotation.y = tourAnim.startY + (tourAnim.targetY - tourAnim.startY) * eased;
      if(t >= 1){ const done = tourAnim.onDone; tourAnim = null; if(done) done(); }
    } else if(autoRotate && !dragging){
      globeGroup.rotation.y += dt * 0.00012;
    }

    // arc pulses travel along their curve
    arcMeshes.forEach(a => {
      const t = ( (now * 0.00025) + a.phase ) % 1;
      const p = a.curve.getPointAt(t);
      a.pulse.position.copy(p);
    });

    // gentle pin pulse scale
    const s = 1 + Math.sin(now * 0.004) * 0.12;
    pinMeshes.forEach(p => p.mesh.scale.setScalar(s));

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------- Clock ----------------
  function tickClock(){
    const d = new Date();
    document.getElementById('clockText').textContent =
      d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  tickClock(); setInterval(tickClock, 15000);

  // ---------------- Dock ----------------
  const dock = document.getElementById('dock');
  function renderDock(){
    dock.innerHTML = '';
    const allBtn = document.createElement('button');
    allBtn.className = 'cat-btn' + (activeCat==='all' ? '' : ' inactive');
    allBtn.style.background = 'linear-gradient(180deg, var(--chrome), var(--chrome-dark))';
    allBtn.innerHTML = '<span class="swatch"></span>All';
    allBtn.addEventListener('click', ()=>{ activeCat='all'; renderDock(); applyFilter(); });
    dock.appendChild(allBtn);
    CATS.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (activeCat===c.id ? '' : ' inactive');
      btn.style.background = `linear-gradient(180deg, ${c.color}, ${c.color})`;
      btn.innerHTML = `<span class="swatch"></span>${c.label}`;
      btn.addEventListener('click', ()=>{ activeCat=c.id; renderDock(); applyFilter(); });
      dock.appendChild(btn);
    });
  }

  // ---------------- Article card ----------------
  const overlayBg = document.getElementById('overlayBg');
  const articleCard = document.getElementById('articleCard');
  const cardTag = document.getElementById('cardTag');
  const cardTitle = document.getElementById('cardTitle');
  const cardInstitutes = document.getElementById('cardInstitutes');
  const cardBody = document.getElementById('cardBody');

  function openArticle(id){
    const story = NEWS.find(n=>n.id===id);
    const catDef = CATS.find(c=>c.id===story.cat);
    pauseAuto();
    cardTag.textContent = catDef.label;
    cardTag.style.background = catDef.color;
    cardTitle.textContent = story.title;
    cardInstitutes.innerHTML = story.inst.map(k => {
      const inst = INST[k];
      return `<div class="institute-row"><span class="dot2" style="background:${catDef.color}"></span>${inst.name}</div>`;
    }).join('');
    cardBody.textContent = story.body;
    overlayBg.classList.add('show');
    articleCard.classList.add('show');
  }
  function closeArticle(){
    overlayBg.classList.remove('show');
    articleCard.classList.remove('show');
  }
  overlayBg.addEventListener('click', closeArticle);
  document.getElementById('cardClose').addEventListener('click', closeArticle);

  // ---------------- Tour mode ----------------
  const tourBtn = document.getElementById('tourBtn');
  let touring = false;
  let tourTimer = null;
  let tourIdx = 0;

  function filteredNews(){ return activeCat==='all' ? NEWS : NEWS.filter(n=>n.cat===activeCat); }

  // ---- speed control ----
  const SPEEDS = [0.25, 0.4, 0.6, 0.85, 1, 1.5, 2];
  let speedIdx = 2; // defaults to 0.6x
  const BASE_STEP_INTERVAL = 7000; // ms between stops, at 1x
  const BASE_GLIDE_DURATION = 1100; // ms of rotation glide, at 1x

  const speedLabel = document.getElementById('speedLabel');
  const speedDownBtn = document.getElementById('speedDown');
  const speedUpBtn = document.getElementById('speedUp');

  function currentSpeed(){ return SPEEDS[speedIdx]; }
  function stepInterval(){ return BASE_STEP_INTERVAL / currentSpeed(); }
  function glideDuration(){
    const raw = BASE_GLIDE_DURATION / currentSpeed();
    return Math.max(400, Math.min(raw, stepInterval() * 0.55));
  }
  function renderSpeedLabel(){
    const v = currentSpeed();
    speedLabel.textContent = (Number.isInteger(v) ? v : v) + 'x';
    speedDownBtn.disabled = speedIdx === 0;
    speedUpBtn.disabled = speedIdx === SPEEDS.length - 1;
  }
  function setSpeed(newIdx){
    speedIdx = Math.max(0, Math.min(SPEEDS.length - 1, newIdx));
    renderSpeedLabel();
    if(touring){
      clearInterval(tourTimer);
      tourTimer = setInterval(stepTour, stepInterval());
    }
  }
  speedDownBtn.addEventListener('click', ()=> setSpeed(speedIdx - 1));
  speedUpBtn.addEventListener('click', ()=> setSpeed(speedIdx + 1));
  renderSpeedLabel();

  function startTour(){
    touring = true;
    tourBtn.classList.add('active');
    autoRotate = false;
    stepTour();
    tourTimer = setInterval(stepTour, stepInterval());
  }
  function stopTour(){
    touring = false;
    tourBtn.classList.remove('active');
    clearInterval(tourTimer);
    autoRotate = true;
    closeArticle();
  }
  function stepTour(){
    const list = filteredNews();
    if(list.length===0) return;
    const story = list[tourIdx % list.length];
    tourIdx++;
    closeArticle();
    const p = INST[story.inst[0]];
    // longitude that should face the camera: theta = lon+180 (deg->rad); camera looks from +z,
    // so we want rotation.y such that the point's world angle faces +z axis.
    const theta = (p.lon + 180) * (Math.PI/180);
    let targetY = (Math.PI/2) - theta;
    // shortest path from current rotation
    const current = globeGroup.rotation.y;
    let delta = ((targetY - current + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
    const target = current + delta;
    tourAnim = { startY: current, targetY: target, startTime: performance.now(), duration: glideDuration(),
      onDone: ()=> openArticle(story.id) };
  }
  tourBtn.addEventListener('click', ()=> touring ? stopTour() : startTour());

  // ---------------- Init ----------------
  async function loadStoryData(){
    try{
      const res = await fetch('./stories.json', { cache:'no-store' });
      if(!res.ok) throw new Error('stories.json responded with ' + res.status);
      const data = await res.json();
      if(!data.stories || !data.stories.length || !data.institutions){
        throw new Error('stories.json was empty or malformed');
      }
      INST = data.institutions;
      NEWS = data.stories;
      console.log(`Loaded ${NEWS.length} stories from stories.json (generated ${data.generated_at || 'unknown time'}).`);
    } catch(err){
      console.warn('Could not load stories.json, falling back to sample data:', err.message);
      INST = SAMPLE_INST;
      NEWS = SAMPLE_NEWS;
    }
  }

  loadStoryData().then(()=>{
    buildGlobeContent();
    renderDock();
    applyFilter();
  });
})();
</script>
</body>
</html>
