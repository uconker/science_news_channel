name: Refresh news snapshot

on:
  schedule:
    # 06:00 UTC daily. GitHub may delay scheduled runs by a few/several
    # minutes at busy times -- that's normal, not a misconfiguration.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab, for testing

permissions:
  contents: write   # needed to commit stories.json back to the repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch bioRxiv snapshot
        run: python3 fetch_biorxiv_snapshot.py --days 3 --pool-size 150 --max-stories 30

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "news-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in stories.json institutions.json unmatched_affiliations.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && echo "No changes, skipping commit" || git commit -m "Refresh news snapshot"
          git push
